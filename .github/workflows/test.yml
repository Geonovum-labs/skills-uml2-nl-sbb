# Offline tests van de scripts, bij elke push en pull request.
# De SHACL-test (BK_NETWERK=1) haalt het NL-SBB-profiel uit het register.
name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Pakketten installeren
        run: pip install -r skills/geonovum-uml2-nl-sbb/requirements.txt

      - name: Manifesten en versie controleren
        run: python3 scripts/generate_plugin.py --check && python3 scripts/sync_version.py --check

      - name: Tests
        env:
          BK_NETWERK: "1"
        run: python3 -m unittest discover -s tests -v
