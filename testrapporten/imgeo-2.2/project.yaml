# project.yaml — alleen afwijkingen van SKILL/standaardkeuzes.yaml. Wijzig met `bk.py zet` of met de hand;
# controleer daarna met `bk.py controleer`. Uitleg per sleutel: SKILL/references/keuzes.md
kader:
