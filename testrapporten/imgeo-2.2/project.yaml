  titel: IMGeo 2.2-begrippenkader
  omschrijving: Begrippen uit het Informatiemodel Geografie (IMGeo) 2.2 — objecttypen, attributen en waarden uit
    waardelijsten, omgezet uit het UML-model (XMI) volgens NL-SBB
